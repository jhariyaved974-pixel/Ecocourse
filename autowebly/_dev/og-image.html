<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Open Graph image template</title>
<link rel="stylesheet" href="/styles.css">
<style>
/* 1200x630 share image in the site's own styles. ?v=home or ?v=b2b picks the copy. */
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{display:grid;grid-template-columns:1.2fr .9fr;gap:56px;padding:60px 72px;box-sizing:border-box;align-items:center}
.l{display:flex;flex-direction:column;justify-content:space-between;height:100%}
.brand{display:flex;align-items:center;gap:14px;font:800 32px/1 var(--display);font-stretch:112%;letter-spacing:-.01em}
.eyebrow{font-size:17px}
h1{font-size:62px;margin-top:20px}
h1 em{font-style:normal;color:var(--cobalt)}
.foot{font:500 19px var(--mono);color:var(--soft)}
.flow{font-size:15px}
.node small{font-size:13px}
</style>
</head>
<body>
<div class="l">
  <div class="brand"><svg width="46" height="46" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--cobalt)"/><circle cx="9" cy="16" r="3.2" fill="#ff6a3d"/><path d="M12 16h5m0 0l3-5m-3 5l3 5" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="23" cy="10" r="2.4" fill="#fff"/><circle cx="23" cy="22" r="2.4" fill="#fff"/></svg>Autowebly</div>
  <div><span class="eyebrow" id="eyebrow"></span><h1 id="headline"></h1></div>
  <div class="foot" id="foot"></div>
</div>
<div class="flow" id="flow"></div>
<script>
var copy = {
  home: {
    eyebrow: 'Automation · Websites · SEO',
    headline: 'Stop doing by hand what <em>software can do</em> for you.',
    foot: 'autowebly.vercel.app',
    flow: 'example workflow · new-enquiry.flow',
    nodes: [['⚡', 'New enquiry', 'website form submitted'], ['1', 'Qualify the lead', 'budget, service, location'], ['2', 'Add to your CRM', 'sheet, HubSpot or Zoho'], ['3', 'Send the follow-up', 'email or WhatsApp, in your words']]
  },
  b2b: {
    eyebrow: 'AI + automation + human expertise',
    headline: 'AI-powered <em>B2B sales pipeline</em> for high-value businesses.',
    foot: 'Plans from ₹1,00,000/month · autowebly.vercel.app',
    flow: 'example pipeline · b2b-outbound.flow',
    nodes: [['⚡', 'Your target market', 'one industry or several segments'], ['1', 'Research and qualify', 'AI-assisted, best-fit accounts first'], ['2', 'Personalised outreach', 'drafts written for each prospect'], ['3', 'Follow-ups and replies', 'replies classified and routed'], ['4', 'Meeting handoff', 'tracked in your CRM pipeline']]
  }
}[new URLSearchParams(location.search).get('v') || 'home'];
document.getElementById('eyebrow').textContent = copy.eyebrow;
document.getElementById('headline').innerHTML = copy.headline;
document.getElementById('foot').textContent = copy.foot;
document.getElementById('flow').innerHTML = '<div class="flow-title"><span>' + copy.flow + '</span><b>● running</b></div>' +
  copy.nodes.map(function (n, i) {
    return (i ? '<div class="link"></div>' : '') + '<div class="node' + (i ? '' : ' trig') + '"><span class="ic">' + n[0] + '</span><div>' + n[1] + '<small>' + n[2] + '</small></div></div>';
  }).join('');
</script>
</body>
</html>
